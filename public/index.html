<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI – Premium AI Career Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0f18;
            --bg2: #111827;
            --bg3: #1e293b;
            --card: #1a2332;
            --border: #2d3748;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --gold-dark: #b45309;
            --blue: #3b82f6;
            --red: #ef4444;
            --green: #22c55e;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Auth overlay */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-container {
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.9);
        }

        .auth-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .auth-tab.active {
            background: var(--gold);
            color: #000;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text2);
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.2);
        }

        .btn-google {
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.2rem 0;
            color: var(--text2);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* App */
        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            min-width: 300px;
            background: rgba(17, 24, 39, 0.95);
            border-right: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .logo i {
            color: var(--gold);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: var(--gold);
            color: #000;
            font-weight: 600;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .new-chat-btn:hover {
            background: var(--gold-light);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            gap: 8px;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-item.active {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
        }

        .chat-item span {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat {
            opacity: 0;
            transition: var(--transition);
            color: var(--red);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .ad-placeholder {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
            border: 1px dashed var(--border);
            color: var(--text2);
            font-size: 0.8rem;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
        }

        .user-info {
            flex: 1;
        }

        .premium-badge {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #000;
            display: none;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg2);
            z-index: 5;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .model-select {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--bg3);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .model-select:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .model-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg3);
            border-radius: 12px;
            margin-top: 8px;
            min-width: 220px;
            box-shadow: var(--shadow);
            z-index: 100;
            overflow: hidden;
            display: none;
        }

        .model-dropdown.open {
            display: block;
        }

        .model-option {
            padding: 10px 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .model-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .upgrade-btn {
            margin-left: auto;
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .upgrade-btn:hover {
            transform: scale(1.02);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: fadeIn 0.3s;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
        }

        .user .msg-bubble {
            background: var(--blue);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai .msg-bubble {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble pre {
            background: #0003;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
        }

        .welcome-icon {
            font-size: 4rem;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .chip {
            padding: 10px 18px;
            border-radius: 25px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.9rem;
        }

        .chip:hover {
            border-color: var(--gold);
            background: rgba(245, 158, 11, 0.1);
        }

        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--bg2);
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            color: var(--text);
            resize: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .input-area textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .ad-banner {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            margin: 0 20px 12px;
            font-size: 0.8rem;
            color: var(--text2);
        }

        .ad-inline {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 6px;
            margin: 12px 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text2);
        }

        .premium-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .premium-card {
            background: var(--card);
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--gold);
            backdrop-filter: blur(20px);
        }

        .plan-option {
            background: var(--bg3);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .plan-option.selected {
            border-color: var(--gold);
        }

        .plan-option h3 {
            color: var(--gold);
        }

        .upgrade-confirm-btn {
            background: var(--gold);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            color: #000;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .upgrade-confirm-btn:hover {
            background: var(--gold-light);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 15;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -320px;
                top: 0;
                bottom: 0;
                z-index: 20;
                width: 300px;
                transition: left 0.3s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu-btn {
                display: block;
            }

            .message-row {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>
    <!-- Auth Overlay -->
    <div id="authOverlay" class="auth-overlay hidden">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin">Sign In</div>
                <div class="auth-tab" id="tabRegister">Sign Up</div>
            </div>
            <form id="loginForm" class="auth-form active">
                <div class="input-group"><label>Email</label><input type="email" id="loginEmail" required></div>
                <div class="input-group"><label>Password</label><input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
                <div class="divider">or</div>
                <div id="googleSignInBtn" class="btn btn-google" style="width:100%"><i class="fab fa-google"></i>
                    Continue with Google</div>
            </form>
            <form id="registerForm" class="auth-form">
                <div class="input-group"><label>Name</label><input type="text" id="regName" required></div>
                <div class="input-group"><label>Email</label><input type="email" id="regEmail" required></div>
                <div class="input-group"><label>Password</label><input type="password" id="regPassword" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-container hidden">
        <div id="overlay" class="overlay"></div>
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><i class="fas fa-rocket"></i> CareerAI</div>
                <button id="newChatBtn" class="new-chat-btn"><i class="fas fa-plus"></i> New Chat</button>
            </div>
            <div id="chatList" class="chat-list"></div>
            <div class="sidebar-footer">
                <!-- <div class="ad-placeholder">📢 Ad Space</div> -->
                <div class="user-row">
                    <div id="userAvatar" class="user-avatar">U</div>
                    <div class="user-info">
                        <div id="userName" style="font-weight:600;">User</div>
                        <span id="premiumBadge" class="premium-badge">PREMIUM</span>
                    </div>
                    <button id="logoutBtn" class="btn" style="background:none; color:var(--text2);"><i
                            class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </aside>
        <main class="main-area">
            <div class="chat-header">
                <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div id="modelSelect" class="model-select">
                    <span id="currentModel">Select Model</span>
                    <i class="fas fa-chevron-down"></i>
                    <div id="modelDropdown" class="model-dropdown"></div>
                </div>
                <button id="upgradeBtn" class="upgrade-btn">✨ Upgrade</button>
            </div>
            <!-- <div class="ad-banner">📢 Banner Ad – Your Ad Here</div> -->
            <div id="messagesContainer" class="messages"></div>
            <!-- <div class="ad-banner">📢 Footer Ad – Place Your Ad</div> -->
            <div class="input-area">
                <textarea id="messageInput" rows="1" placeholder="Ask about your future career..."></textarea>
                <button id="sendBtn" class="send-btn"><i class="fas fa-arrow-up"></i></button>
            </div>
        </main>
    </div>

    <!-- Premium Modal with Plan Selection -->
    <div id="premiumModal" class="premium-modal hidden">
        <div class="premium-card">
            <h2>🚀 Choose Your Plan</h2>
            <div class="plan-options">
                <div class="plan-option" data-plan="daily">
                    <h3>📅 Daily</h3>
                    <p>₹9 / day</p>
                </div>
                <div class="plan-option selected" data-plan="monthly">
                    <h3>📆 Monthly</h3>
                    <p>₹49 / month</p>
                </div>
                <div class="plan-option" data-plan="yearly">
                    <h3>📅 Yearly</h3>
                    <p>₹99 / year</p>
                </div>
            </div>
            <button id="confirmUpgrade" class="upgrade-confirm-btn">Upgrade</button>
            <button id="closePremium" class="btn" style="background:none; margin-top:10px; color:var(--text2);">Maybe
                later</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // ============ CONFIG ============
        const API_BASE = window.location.origin;
        const GOOGLE_CLIENT_ID = '380092904667-sfp69lf4a1sbumhvj3u9rmofer8q3fms.apps.googleusercontent.com'; // replace

        let token = localStorage.getItem('careerai_token');
        let currentUser = null;
        let conversations = [];
        let activeConvId = null;
        let models = [];
        let selectedModel = null;
        let selectedPlan = 'monthly';

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', async () => {
            if (token) {
                // Verify token silently
                const valid = await verifyToken();
                if (valid) {
                    document.getElementById('app').classList.remove('hidden');
                    document.getElementById('authOverlay').classList.add('hidden');
                    await loadApp();
                } else {
                    localStorage.removeItem('careerai_token');
                    token = null;
                    document.getElementById('authOverlay').classList.remove('hidden');
                }
            } else {
                document.getElementById('authOverlay').classList.remove('hidden');
            }

            // Auth tabs
            document.getElementById('tabLogin').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('tabRegister').addEventListener('click', () => switchAuthTab('register'));
            document.getElementById('loginForm').addEventListener('submit', login);
            document.getElementById('registerForm').addEventListener('submit', register);

            // Google Sign-In - load after page
            loadGoogleSignIn();
        });

        async function verifyToken() {
            try {
                const res = await fetch(`${API_BASE}/api/user`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                return res.ok;
            } catch { return false; }
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function loadGoogleSignIn() {
            if (window.google && google.accounts) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById('googleSignInBtn'),
                    { theme: 'outline', size: 'large', width: '100%' }
                );
            } else {
                // Fallback - try again after a delay or show alert
                console.warn('Google Sign-In not loaded, retrying in 2s...');
                setTimeout(loadGoogleSignIn, 2000);
            }
        }

        // ============ AUTH ============
        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                handleAuthSuccess(data);
            } catch (err) { alert(err.message); }
        }

        async function register(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                handleAuthSuccess(data);
            } catch (err) { alert(err.message); }
        }

        function handleGoogleResponse(response) {
            fetch(`${API_BASE}/api/auth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    handleAuthSuccess(data);
                })
                .catch(err => alert(err.message));
        }

        function handleAuthSuccess(data) {
            token = data.token;
            currentUser = data.user;
            localStorage.setItem('careerai_token', token);
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            loadApp();
        }

        function logout() {
            localStorage.removeItem('careerai_token');
            token = null;
            currentUser = null;
            activeConvId = null;
            conversations = [];
            document.getElementById('app').classList.add('hidden');
            document.getElementById('authOverlay').classList.remove('hidden');
            document.getElementById('messagesContainer').innerHTML = '';
            document.getElementById('chatList').innerHTML = '';
        }

        // ============ APP ============
        async function loadApp() {
            // Fetch user
            const userRes = await fetch(`${API_BASE}/api/user`, { headers: { Authorization: `Bearer ${token}` } });
            if (!userRes.ok) { logout(); return; }
            currentUser = await userRes.json();
            document.getElementById('userAvatar').textContent = (currentUser.name || currentUser.email)[0].toUpperCase();
            document.getElementById('userName').textContent = currentUser.name || currentUser.email;
            if (currentUser.is_premium) {
                document.getElementById('premiumBadge').style.display = 'inline-block';
            }

            // Fetch models
            await fetchModels();
            // Conversations
            await loadConversations();
            if (!activeConvId && conversations.length > 0) switchConversation(conversations[0].id);
            else if (conversations.length === 0) renderWelcomeScreen();

            // Event listeners
            document.getElementById('newChatBtn').addEventListener('click', createNewChat);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('upgradeBtn').addEventListener('click', showPremiumModal);
            document.getElementById('closePremium').addEventListener('click', hidePremiumModal);
            document.getElementById('confirmUpgrade').addEventListener('click', initiateRazorpayPayment);
            document.getElementById('mobileMenuBtn').addEventListener('click', toggleMobileSidebar);
            document.getElementById('overlay').addEventListener('click', closeMobileSidebar);
            document.getElementById('modelSelect').addEventListener('click', toggleModelDropdown);

            // Plan selection
            document.querySelectorAll('.plan-option').forEach(opt => {
                opt.addEventListener('click', function () {
                    document.querySelectorAll('.plan-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedPlan = this.dataset.plan;
                });
            });

            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            });

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('modelDropdown');
                if (!e.target.closest('#modelSelect') && dropdown.classList.contains('open')) dropdown.classList.remove('open');
            });
        }

        async function fetchModels() {
            const res = await fetch(`${API_BASE}/api/models`);
            const data = await res.json();
            models = data.models || [];
            if (models.length > 0 && !selectedModel) selectedModel = models[0];
            updateModelDisplay();
            buildModelDropdown();
        }

        function updateModelDisplay() {
            document.getElementById('currentModel').textContent = selectedModel ? selectedModel.name : 'No model';
        }

        function buildModelDropdown() {
            const dropdown = document.getElementById('modelDropdown');
            dropdown.innerHTML = models.map(m => `<div class="model-option" data-id="${m.id}">${m.name}</div>`).join('');
            document.querySelectorAll('.model-option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    selectedModel = models.find(m => m.id === e.target.dataset.id) || selectedModel;
                    updateModelDisplay();
                    dropdown.classList.remove('open');
                });
            });
        }

        function toggleModelDropdown(e) {
            e.stopPropagation();
            document.getElementById('modelDropdown').classList.toggle('open');
        }

        // ============ CONVERSATIONS ============
        async function loadConversations() {
            const res = await fetch(`${API_BASE}/api/conversations`, { headers: { Authorization: `Bearer ${token}` } });
            conversations = await res.json();
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = conversations.map(c => `
                <div class="chat-item ${c.id === activeConvId ? 'active' : ''}" data-id="${c.id}">
                    <span>${escapeHtml(c.title || 'New Chat')}</span>
                    <i class="fas fa-trash delete-chat" data-id="${c.id}"></i>
                </div>
            `).join('');
            list.querySelectorAll('.chat-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-chat')) return;
                    switchConversation(parseInt(item.dataset.id));
                });
            });
            list.querySelectorAll('.delete-chat').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(parseInt(btn.dataset.id));
                });
            });
        }

        function switchConversation(id) {
            activeConvId = id;
            renderChatList();
            loadMessages(id);
            closeMobileSidebar();
        }

        async function loadMessages(convId) {
            const res = await fetch(`${API_BASE}/api/conversations/${convId}/messages`, { headers: { Authorization: `Bearer ${token}` } });
            const messages = await res.json();
            renderMessages(messages);
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            if (messages.length === 0) { renderWelcomeScreen(); return; }
            let html = '';
            messages.forEach((m, i) => {
                html += `<div class="message-row ${m.role}"><div class="msg-bubble">${marked.parse(m.content)}</div></div>`;
                if ((i + 1) % 5 === 0 && i !== messages.length - 1) html += '<div class="ad-inline">📢 In-feed Ad</div>';
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function renderWelcomeScreen() {
            document.getElementById('messagesContainer').innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-icon">💼</div>
                    <h2>Discover Your Future Career</h2>
                    <p>AI‑powered guidance with flowcharts, salaries, and more.</p>
                    <div class="suggestions">
                        <div class="chip" data-prompt="What are the top careers in 2026?">🔥 Top 2026</div>
                        <div class="chip" data-prompt="How to become a data scientist in 6 months?">📊 Data Science</div>
                        <div class="chip" data-prompt="Best remote jobs for beginners">🌍 Remote</div>
                        <div class="chip" data-prompt="What skills pay the most right now?">💰 High Pay</div>
                    </div>
                </div>`;
            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.getElementById('messageInput').value = chip.dataset.prompt;
                    sendMessage();
                });
            });
        }

        async function createNewChat() {
            const res = await fetch(`${API_BASE}/api/conversations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ model: selectedModel?.id })
            });
            const data = await res.json();
            await loadConversations();
            switchConversation(data.id);
        }

        async function deleteChat(convId) {
            if (!confirm('Delete this conversation?')) return;
            await fetch(`${API_BASE}/api/conversations/${convId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
            if (activeConvId === convId) activeConvId = null;
            await loadConversations();
            if (conversations.length === 0) document.getElementById('messagesContainer').innerHTML = '';
            else if (!activeConvId) switchConversation(conversations[0].id);
        }

        // ============ CHAT ============
        async function sendMessage() {
            if (isProcessing) return;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeConvId || !selectedModel) {
                if (!activeConvId) alert('Please start a new chat first.');
                if (!selectedModel) alert('Please select an AI model.');
                return;
            }
            input.value = ''; input.style.height = 'auto';
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;

            const container = document.getElementById('messagesContainer');
            container.innerHTML += `<div class="message-row user"><div class="msg-bubble">${escapeHtml(text)}</div></div>`;
            container.innerHTML += `<div class="typing" id="typing"><span></span><span></span><span></span></div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ conversationId: activeConvId, model: selectedModel.id, provider: selectedModel.provider, message: text })
                });
                document.getElementById('typing')?.remove();
                const data = await res.json();
                if (!res.ok) {
                    if (res.status === 429) { showPremiumModal(); throw new Error('Daily limit reached. Upgrade to Premium.'); }
                    throw new Error(data.error || 'Something went wrong');
                }
                container.innerHTML += `<div class="message-row ai"><div class="msg-bubble">${marked.parse(data.reply)}</div></div>`;
                container.scrollTop = container.scrollHeight;
                await loadConversations();
            } catch (err) { document.getElementById('typing')?.remove(); alert(err.message); }
            finally { isProcessing = false; document.getElementById('sendBtn').disabled = false; document.getElementById('messageInput').focus(); }
        }

        let isProcessing = false;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============ PREMIUM & RAZORPAY ============
        function showPremiumModal() { document.getElementById('premiumModal').classList.remove('hidden'); }
        function hidePremiumModal() { document.getElementById('premiumModal').classList.add('hidden'); }

        async function initiateRazorpayPayment() {
            try {
                const orderRes = await fetch(`${API_BASE}/api/premium/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ plan: selectedPlan })
                });
                const orderData = await orderRes.json();
                if (!orderRes.ok) throw new Error(orderData.error);

                const options = {
                    key: orderData.key,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    order_id: orderData.orderId,
                    name: 'CareerAI Premium',
                    description: `Upgrade to ${selectedPlan}`,
                    handler: async function (response) {
                        const verifyRes = await fetch(`${API_BASE}/api/premium/verify`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                            body: JSON.stringify({
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_signature: response.razorpay_signature
                            })
                        });
                        const verifyData = await verifyRes.json();
                        if (verifyRes.ok) {
                            token = verifyData.token;
                            localStorage.setItem('careerai_token', token);
                            currentUser.is_premium = verifyData.is_premium;
                            currentUser.subscription_type = verifyData.subscription_type;
                            currentUser.subscription_expiry = verifyData.subscription_expiry;
                            document.getElementById('premiumBadge').style.display = 'inline-block';
                            hidePremiumModal();
                            alert(`🎉 You are now Premium (${verifyData.subscription_type})!`);
                        } else {
                            alert('Payment verification failed.');
                        }
                    },
                    theme: { color: '#f59e0b' }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) { alert(err.message); }
        }

        // ============ MOBILE SIDEBAR ============
        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }
        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>
</body>

</html>
